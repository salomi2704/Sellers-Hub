version: '3.9'
services:
  frontend:
    build: ../../apps/frontend
    command: npm run dev -- --host 0.0.0.0 --port 4173
    working_dir: /workspace/apps/frontend
    volumes:
      - ../../:/workspace
    ports:
      - '4173:4173'
    depends_on:
      - api

  api:
    build: ../../services/api
    command: npm run start:dev
    working_dir: /workspace/services/api
    volumes:
      - ../../:/workspace
    environment:
      PORT: 3000
      JWT_SECRET: local-secret
      FRONTEND_ORIGIN: http://localhost:4173
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wysh
      POSTGRES_USER: wysh
      POSTGRES_PASSWORD: wysh
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
