version: '3.9'
services:
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    image: ghcr.io/salomi2704/sellers-hub-frontend:latest
    command: npm run start
    ports:
      - '4173:4173'
    environment:
      - PORT=4173
      - API_URL=http://api:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    image: ghcr.io/salomi2704/sellers-hub-api:latest
    command: npm run start:prod
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-local-secret}
      - FRONTEND_ORIGIN=http://localhost:4173
      - DATABASE_URL=postgres://wysh:wysh@postgres:5432/wysh
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=wysh
      - POSTGRES_USER=wysh
      - POSTGRES_PASSWORD=wysh
    ports:
      - '5432:5432'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wysh -d wysh"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ':9001'
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 40s
      timeout: 10s
      retries: 3