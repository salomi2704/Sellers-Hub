version: '3.9'
services:
  frontend:
    build: ../../apps/frontend
    command: npm run dev -- --host 0.0.0.0 --port 4173
    working_dir: /workspace/apps/frontend
    volumes:
      - ../../:/workspace
    ports:
      - '4173:4173'
    depends_on:
      - api

  api:
    build: ../../services/api
    command: sh -c "npm run prisma:migrate && npm run start:dev"
    working_dir: /workspace/services/api
    volumes:
      - ../../:/workspace
    environment:
      PORT: 3000
      JWT_SECRET: local-secret-local-secret-local-secret
      FRONTEND_ORIGIN: http://localhost:4173
      DATABASE_URL: postgresql://wysh:wysh@postgres:5432/wysh?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: sellers-hub
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wysh
      POSTGRES_USER: wysh
      POSTGRES_PASSWORD: wysh
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wysh -d wysh']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
