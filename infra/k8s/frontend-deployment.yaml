apiVersion: apps/v1
kind: Deployment
metadata:
  name: sellers-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sellers-frontend
  template:
    metadata:
      labels:
app: sellers-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/salomi2704/sellers-hub-frontend:latest
          ports:
            - containerPort: 4173
