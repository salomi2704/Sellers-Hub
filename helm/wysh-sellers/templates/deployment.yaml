apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-api
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api }}
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 3000
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: 3000
